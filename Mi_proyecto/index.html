<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Paisajes | Colección Visual</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Navegación -->
    <header class="header">
        <div class="header-container">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
                    </svg>
                </div>
                <div>
                    <h1>Galería Paisajes</h1>
                    <p class="subtitle">Explora, descarga y comparte fotografía de la naturaleza</p>
                </div>
            </div>

            <!-- Botón Tema Oscuro / Claro -->
            <button id="themeToggle" class="theme-btn" title="Cambiar tema de color" aria-label="Cambiar tema">
                <svg id="themeIconSun" class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <svg id="themeIconMoon" class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-content">
        <!-- Barra de Búsqueda y Filtros -->
        <section class="controls-section">
            <div class="search-box">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Buscar paisajes por nombre o etiqueta..." autocomplete="off">
                <button id="clearSearch" class="clear-btn" title="Limpiar búsqueda" style="display: none;">&times;</button>
            </div>

            <div class="filter-chips" id="filterContainer">
                <button class="chip active" data-category="todos">Todos</button>
                <button class="chip" data-category="montanas">Montañas</button>
                <button class="chip" data-category="bosques">Bosques</button>
                <button class="chip" data-category="lagos">Lagos y Playas</button>
                <button class="chip" data-category="atardeceres">Atardeceres</button>
                <button class="chip chip-fav" data-category="favoritos">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    Favoritos (<span id="favCount">0</span>)
                </button>
            </div>
        </section>

        <!-- Cuadrícula de Galería -->
        <section class="gallery-section">
            <div class="gallery-status" id="galleryStatus"></div>
            <div class="galeria" id="galleryGrid">
                <!-- Se generará dinámicamente con JavaScript -->
            </div>
        </section>
    </main>

    <!-- Modal / Visor de Imagen Pantalla Completa (Lightbox) -->
    <div id="lightboxModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-wrapper">
            <button class="modal-close" id="modalClose" aria-label="Cerrar visor">&times;</button>
            
            <button class="modal-nav modal-prev" id="modalPrev" aria-label="Imagen anterior">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>

            <div class="modal-content">
                <img id="modalImg" src="" alt="Vista previa">
                <div class="modal-info">
                    <div>
                        <h3 id="modalTitle">Título del Paisaje</h3>
                        <span id="modalCategory" class="badge">Categoría</span>
                    </div>
                    <div class="modal-actions">
                        <button class="btn-icon" id="modalFavBtn" title="Añadir a favoritos">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                        </button>
                        <a id="modalDownloadBtn" href="" download class="btn btn-primary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                            </svg>
                            Descargar
                        </a>
                        <button class="btn btn-secondary" id="modalShareBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/>
                            </svg>
                            Compartir
                        </button>
                    </div>
                </div>
            </div>

            <button class="modal-nav modal-next" id="modalNext" aria-label="Imagen siguiente">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Contenedor de Alertas / Toast -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
