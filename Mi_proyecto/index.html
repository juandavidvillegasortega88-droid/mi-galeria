<script>
    async function compartir(ruta){
        const url = new URL(ruta,location.href).href;
        if (navigator.share) {
            await navigator.share({title:"Paisaje",url: url});
        }else {
            await navigator.clipboard.writeText(url);
            alert("Enlace copiado");
        }
    }
